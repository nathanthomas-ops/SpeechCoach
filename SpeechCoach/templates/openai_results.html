<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YJMNCG140L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-YJMNCG140L');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='debate-favicon.svg') }}">
    <title>Analysis</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .button-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
        .button-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
  <header>
    <div class="header-left">
      <a href="/">
        <img src="{{ url_for('static', filename='debate-favicon.svg') }}" alt="Favicon" class="favicon-img" />
      </a>
    </div>
    <div class="header-center">TabroomPlus</div>
    <div class="settings-container">
      <button class="settings-btn" onclick="toggleSettings()">
        <i class="fa-solid fa-gear"></i>
      </button>
      <div class="settings-dropdown" id="settingsDropdown">
        <button class="dropdown-item" onclick="toggleMode()">
          <i class="fa-solid fa-circle-half-stroke"></i> Theme
        </button>
        <button class="dropdown-item" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </header>

    <h1 class="header">Judge Summary</h1>
    <div class="container" style="max-width: 800px; margin: 40px auto;">
        <p style="line-height: 1.6;">{{ comments | safe }}</p>
    </div>
    <div style="text-align: center; margin-top: 20px;">
        <a href="/tournaments" action="/tournaments" class="button-link">Back to Tournaments</a>
    </div>

  <script>
    function toggleMode() {
      document.body.classList.toggle('light-mode');
    }

    function toggleSettings() {
      const dropdown = document.getElementById('settingsDropdown');
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    function logout() {
      window.location.href = '/login';
    }

    // Close dropdown when clicking outside
    window.onclick = function(event) {
      if (!event.target.matches('.settings-btn') && !event.target.matches('.fa-gear')) {
        const dropdown = document.getElementById('settingsDropdown');
        if (dropdown.style.display === 'block') {
          dropdown.style.display = 'none';
        }
      }
    }
  </script>
</body>
</html>
